name: Build and deploy Omni

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          EXPO_PUBLIC_TMDB_READ_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_TMDB_READ_ACCESS_TOKEN }}
          EXPO_PUBLIC_GOOGLE_BOOKS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_BOOKS_API_KEY }}
          EXPO_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_PLACES_API_KEY }}
          EXPO_PUBLIC_YOUTUBE_API_KEY: ${{ secrets.EXPO_PUBLIC_YOUTUBE_API_KEY }}
          EXPO_PUBLIC_TICKETMASTER_API_KEY: ${{ secrets.EXPO_PUBLIC_TICKETMASTER_API_KEY }}
          EXPO_PUBLIC_HOME_CITY: ${{ secrets.EXPO_PUBLIC_HOME_CITY }}
          EXPO_PUBLIC_HOME_COUNTRY: ${{ secrets.EXPO_PUBLIC_HOME_COUNTRY }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_LASTFM_API_KEY: ${{ secrets.EXPO_PUBLIC_LASTFM_API_KEY }}
          EXPO_PUBLIC_ITUNES_COUNTRY: CA
          EXPO_PUBLIC_TMDB_WATCH_REGION: CA

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-game-catalogue:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      BGG_APPLICATION_TOKEN: ${{ secrets.BGG_APPLICATION_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set game API secrets
        run: |
          supabase secrets set \
            IGDB_CLIENT_ID="$IGDB_CLIENT_ID" \
            IGDB_CLIENT_SECRET="$IGDB_CLIENT_SECRET" \
            BGG_APPLICATION_TOKEN="$BGG_APPLICATION_TOKEN" \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy game catalogue function
        run: |
          supabase functions deploy game-catalogue \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs:
      - build
      - deploy-game-catalogue

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4