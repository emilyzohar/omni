name: Deploy game catalogue function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/game-catalogue/**'
      - '.github/workflows/deploy-game-catalogue.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      BGG_APPLICATION_TOKEN: ${{ secrets.BGG_APPLICATION_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync game API secrets
        run: |
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_ID" \
            IGDB_CLIENT_ID="$IGDB_CLIENT_ID" \
            IGDB_CLIENT_SECRET="$IGDB_CLIENT_SECRET" \
            BGG_APPLICATION_TOKEN="$BGG_APPLICATION_TOKEN"

      - name: Deploy game-catalogue
        run: supabase functions deploy game-catalogue --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
