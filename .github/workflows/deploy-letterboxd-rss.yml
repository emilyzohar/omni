name: Deploy Letterboxd RSS proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/letterboxd-rss/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-letterboxd-rss.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Letterboxd RSS proxy
        run: supabase functions deploy letterboxd-rss --project-ref "$SUPABASE_PROJECT_ID"
