name: Build and deploy Catch All

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          EXPO_PUBLIC_TMDB_READ_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_TMDB_READ_ACCESS_TOKEN }}
          EXPO_PUBLIC_GOOGLE_BOOKS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_BOOKS_API_KEY }}
          EXPO_PUBLIC_YOUTUBE_API_KEY: ${{ secrets.EXPO_PUBLIC_YOUTUBE_API_KEY }}
          EXPO_PUBLIC_TICKETMASTER_API_KEY: ${{ secrets.EXPO_PUBLIC_TICKETMASTER_API_KEY }}
          EXPO_PUBLIC_HOME_CITY: ${{ secrets.EXPO_PUBLIC_HOME_CITY }}
          EXPO_PUBLIC_HOME_COUNTRY: ${{ secrets.EXPO_PUBLIC_HOME_COUNTRY }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_LASTFM_API_KEY: ${{ secrets.EXPO_PUBLIC_LASTFM_API_KEY }}
          EXPO_PUBLIC_ITUNES_COUNTRY: CA
          EXPO_PUBLIC_TMDB_WATCH_REGION: CA
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
